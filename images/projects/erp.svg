<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="Motorcycle Spare Parts ERP desktop window mockup">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1122"/>
      <stop offset="1" stop-color="#12203a"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="s" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="600" height="340" fill="url(#bg)"/>
  <g opacity="0.05" stroke="#fff">
    <path d="M100 0v340M200 0v340M300 0v340M400 0v340M500 0v340M0 85h600M0 170h600M0 255h600"/>
  </g>

  <!-- window chrome -->
  <g filter="url(#s)">
    <rect x="30" y="30" width="540" height="278" rx="16" fill="#0d1326" stroke="#22d3ee" stroke-opacity="0.3"/>
    <rect x="30" y="30" width="540" height="44" rx="16" fill="#0a0e1a"/>
    <rect x="30" y="58" width="540" height="16" fill="#0a0e1a"/>
    <circle cx="52" cy="52" r="6" fill="#f87171"/>
    <circle cx="70" cy="52" r="6" fill="#fbbf24"/>
    <circle cx="88" cy="52" r="6" fill="#34d399"/>
    <text x="300" y="58" font-family="Arial" font-size="12" fill="#8fa3bf" text-anchor="middle">Motorcycle Spare Parts ERP — v1.0</text>
  </g>

  <!-- top nav -->
  <g font-family="Arial" font-size="11" fill="#8fa3bf">
    <text x="56" y="98">Dashboard</text>
    <text x="126" y="98">Products</text>
    <text x="186" y="98">Inventory</text>
    <text x="250" y="98">Sales</text>
    <text x="292" y="98">Purchases</text>
    <text x="360" y="98">Customers</text>
    <text x="432" y="98">Suppliers</text>
    <text x="492" y="98" fill="#22d3ee">Reports</text>
  </g>
  <rect x="488" y="104" width="52" height="3" rx="1.5" fill="#22d3ee"/>

  <!-- KPI cards -->
  <g filter="url(#s)">
    <rect x="50" y="116" width="120" height="60" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-opacity="0.35"/>
    <text x="66" y="140" font-family="Arial" font-size="10" fill="#8fa3bf">STOCK VALUE</text>
    <text x="66" y="164" font-family="Arial" font-size="18" font-weight="bold" fill="#3b82f6">Rs 4.2M</text>
  </g>
  <g filter="url(#s)">
    <rect x="182" y="116" width="120" height="60" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="198" y="140" font-family="Arial" font-size="10" fill="#8fa3bf">SALES TODAY</text>
    <text x="198" y="164" font-family="Arial" font-size="18" font-weight="bold" fill="#22d3ee">Rs 86,400</text>
  </g>
  <g filter="url(#s)">
    <rect x="314" y="116" width="120" height="60" rx="12" fill="#0f172a" stroke="#8b5cf6" stroke-opacity="0.35"/>
    <text x="330" y="140" font-family="Arial" font-size="10" fill="#8fa3bf">PRODUCTS</text>
    <text x="330" y="164" font-family="Arial" font-size="18" font-weight="bold" fill="#8b5cf6">1,240</text>
  </g>
  <g filter="url(#s)">
    <rect x="446" y="116" width="104" height="60" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-opacity="0.3"/>
    <text x="462" y="140" font-family="Arial" font-size="10" fill="#8fa3bf">LOW STOCK</text>
    <text x="462" y="164" font-family="Arial" font-size="18" font-weight="bold" fill="#fbbf24">14</text>
  </g>

  <!-- table -->
  <g filter="url(#s)">
    <rect x="50" y="192" width="330" height="96" rx="12" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.08"/>
    <g font-family="Arial" font-size="10" fill="#6c7a90">
      <text x="66" y="214">Product</text>
      <text x="196" y="214">Stock</text>
      <text x="250" y="214">Price</text>
      <text x="312" y="214">Status</text>
    </g>
    <g font-family="Arial" font-size="10.5" fill="#c8d4e6">
      <text x="66" y="234">Chain Sprocket Kit</text>
      <text x="198" y="234">120</text>
      <text x="252" y="234">Rs 4,500</text>
      <circle cx="316" cy="231" r="4" fill="#34d399"/>
      <text x="66" y="254">Brake Pads (Front)</text>
      <text x="198" y="254">8</text>
      <text x="252" y="254">Rs 1,200</text>
      <circle cx="316" cy="251" r="4" fill="#fbbf24"/>
      <text x="66" y="274">Air Filter</text>
      <text x="198" y="274">64</text>
      <text x="252" y="274">Rs 850</text>
      <circle cx="316" cy="271" r="4" fill="#34d399"/>
    </g>
  </g>

  <!-- sales chart -->
  <g filter="url(#s)">
    <rect x="392" y="192" width="158" height="96" rx="12" fill="#0f172a" stroke="#8b5cf6" stroke-opacity="0.3"/>
    <text x="408" y="214" font-family="Arial" font-size="10" fill="#8fa3bf">SALES (30 DAYS)</text>
    <polyline points="408,276 432,268 456,272 480,250 504,258 528,234 540,240" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="408" y="252" width="16" height="22" rx="3" fill="#3b82f6" opacity="0.5"/>
    <rect x="432" y="246" width="16" height="28" rx="3" fill="#3b82f6" opacity="0.6"/>
    <rect x="456" y="256" width="16" height="18" rx="3" fill="#22d3ee" opacity="0.5"/>
    <rect x="480" y="238" width="16" height="36" rx="3" fill="#22d3ee" opacity="0.7"/>
  </g>

  <text x="600" y="24" font-family="Arial" font-size="13" font-weight="bold" fill="#22d3ee" text-anchor="end">DESKTOP ERP</text>
</svg>
