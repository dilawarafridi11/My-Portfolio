<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="WebGuard SaaS monitoring dashboard mockup">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1226"/>
      <stop offset="1" stop-color="#0d1a2e"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="pur" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="s" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="600" height="340" fill="url(#bg)"/>
  <g opacity="0.05" stroke="#fff">
    <path d="M100 0v340M200 0v340M300 0v340M400 0v340M500 0v340M0 85h600M0 170h600M0 255h600"/>
  </g>

  <!-- top bar -->
  <rect x="34" y="30" width="532" height="44" rx="12" fill="#0a0e1a" stroke="#22d3ee" stroke-opacity="0.35"/>
  <text x="56" y="58" font-family="Arial" font-size="14" font-weight="bold" fill="#22d3ee">WebGuard</text>
  <rect x="430" y="42" width="60" height="20" rx="10" fill="url(#acc)" opacity="0.9"/>
  <rect x="496" y="42" width="52" height="20" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-opacity="0.5"/>

  <!-- sidebar -->
  <rect x="34" y="90" width="150" height="220" rx="14" fill="#0a0e1a" stroke="#ffffff" stroke-opacity="0.08"/>
  <g font-family="Arial" font-size="11" fill="#8fa3bf">
    <text x="54" y="120">Dashboard</text>
    <text x="54" y="146">Sites</text>
    <text x="54" y="172">Uptime</text>
    <text x="54" y="198">Response Time</text>
    <text x="54" y="224">SSL Certificates</text>
    <text x="54" y="250">Domains</text>
    <text x="54" y="276">Reports</text>
    <text x="54" y="296" fill="#22d3ee">Alerts</text>
  </g>
  <rect x="44" y="282" width="70" height="5" rx="2.5" fill="#22d3ee"/>

  <!-- uptime big number -->
  <g filter="url(#s)">
    <rect x="200" y="90" width="182" height="104" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.3"/>
    <text x="220" y="118" font-family="Arial" font-size="11" fill="#8fa3bf">UPTIME</text>
    <text x="220" y="164" font-family="Arial" font-size="34" font-weight="bold" fill="#34d399">99.98%</text>
    <circle cx="348" cy="164" r="22" fill="none" stroke="#34d399" stroke-opacity="0.2" stroke-width="5"/>
    <circle cx="348" cy="164" r="22" fill="none" stroke="#34d399" stroke-width="5" stroke-dasharray="128 140" stroke-linecap="round" transform="rotate(-90 348 164)"/>
  </g>

  <!-- response time -->
  <g filter="url(#s)">
    <rect x="398" y="90" width="168" height="104" rx="14" fill="#0f172a" stroke="#3b82f6" stroke-opacity="0.3"/>
    <text x="418" y="118" font-family="Arial" font-size="11" fill="#8fa3bf">RESPONSE TIME</text>
    <text x="418" y="164" font-family="Arial" font-size="34" font-weight="bold" fill="#22d3ee">240ms</text>
    <polyline points="440,170 470,160 500,168 530,152 548,158" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- SSL + domain mini cards -->
  <g filter="url(#s)">
    <rect x="200" y="208" width="182" height="102" rx="14" fill="#0f172a" stroke="#34d399" stroke-opacity="0.25"/>
    <text x="220" y="234" font-family="Arial" font-size="11" fill="#8fa3bf">SSL CERTIFICATE</text>
    <text x="220" y="266" font-family="Arial" font-size="15" font-weight="bold" fill="#34d399">Valid · 112 days</text>
    <rect x="220" y="282" width="144" height="6" rx="3" fill="#ffffff" opacity="0.1"/>
    <rect x="220" y="282" width="110" height="6" rx="3" fill="#34d399"/>
  </g>
  <g filter="url(#s)">
    <rect x="398" y="208" width="168" height="102" rx="14" fill="#0f172a" stroke="#fbbf24" stroke-opacity="0.25"/>
    <text x="418" y="234" font-family="Arial" font-size="11" fill="#8fa3bf">DOMAIN EXPIRATION</text>
    <text x="418" y="266" font-family="Arial" font-size="15" font-weight="bold" fill="#fbbf24">In 214 days</text>
    <rect x="418" y="282" width="130" height="6" rx="3" fill="#ffffff" opacity="0.1"/>
    <rect x="418" y="282" width="80" height="6" rx="3" fill="#fbbf24"/>
  </g>

  <!-- alert pill -->
  <g filter="url(#s)">
    <rect x="34" y="76" width="532" height="0" fill="none"/>
  </g>
  <g transform="translate(430,86)" filter="url(#s)">
    <rect x="0" y="0" width="130" height="26" rx="13" fill="#2a1220" stroke="#f87171" stroke-opacity="0.5"/>
    <circle cx="16" cy="13" r="5" fill="#f87171"/>
    <text x="28" y="17" font-family="Arial" font-size="11" fill="#fca5a5">1 site down · alert</text>
  </g>

  <text x="600" y="24" font-family="Arial" font-size="13" font-weight="bold" fill="#3b82f6" text-anchor="end">SaaS MONITORING</text>
</svg>
