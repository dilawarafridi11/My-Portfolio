<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img" aria-label="Developer working on web and mobile applications">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131a33"/>
      <stop offset="1" stop-color="#0a0e1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2c9a0"/>
      <stop offset="1" stop-color="#e0a878"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="480" height="480" rx="120" fill="url(#bgGrad)"/>

  <!-- decorative grid -->
  <g opacity="0.06" stroke="#ffffff">
    <path d="M80 40v400M160 40v400M240 40v400M320 40v400M400 40v400"/>
    <path d="M40 80h400M40 160h400M40 240h400M40 320h400M40 400h400"/>
  </g>

  <!-- orbit ring -->
  <circle cx="240" cy="240" r="205" fill="none" stroke="#3b82f6" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 8"/>
  <circle cx="240" cy="240" r="150" fill="none" stroke="#22d3ee" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="4 10"/>

  <!-- halo -->
  <circle cx="240" cy="240" r="130" fill="url(#accent)" opacity="0.10" filter="url(#glow)"/>

  <!-- floating nodes -->
  <g>
    <circle cx="86" cy="130" r="7" fill="#22d3ee" opacity="0.9"/>
    <circle cx="404" cy="150" r="5" fill="#3b82f6" opacity="0.8"/>
    <circle cx="70" cy="330" r="5" fill="#8b5cf6" opacity="0.8"/>
    <circle cx="410" cy="320" r="7" fill="#22d3ee" opacity="0.7"/>
    <circle cx="130" cy="70" r="4" fill="#8b5cf6" opacity="0.7"/>
    <circle cx="360" cy="410" r="4" fill="#3b82f6" opacity="0.7"/>
  </g>

  <!-- phone floating left -->
  <g transform="translate(60,190)" filter="url(#glow)">
    <rect x="0" y="0" width="74" height="128" rx="14" fill="#0d1226" stroke="#8b5cf6" stroke-opacity="0.7" stroke-width="2"/>
    <rect x="26" y="8" width="22" height="5" rx="2.5" fill="#8b5cf6"/>
    <rect x="10" y="20" width="54" height="40" rx="7" fill="#3b82f6" opacity="0.25"/>
    <rect x="14" y="26" width="20" height="6" rx="3" fill="#22d3ee"/>
    <rect x="14" y="36" width="30" height="4" rx="2" fill="#ffffff" opacity="0.25"/>
    <rect x="10" y="66" width="54" height="10" rx="5" fill="#8b5cf6" opacity="0.35"/>
    <rect x="10" y="82" width="54" height="8" rx="4" fill="#ffffff" opacity="0.08"/>
    <rect x="10" y="95" width="54" height="8" rx="4" fill="#ffffff" opacity="0.08"/>
    <rect x="30" y="112" width="14" height="3" rx="1.5" fill="#22d3ee"/>
  </g>

  <!-- code window floating right -->
  <g transform="translate(340,120)">
    <rect x="0" y="0" width="100" height="78" rx="12" fill="#0d1226" stroke="#22d3ee" stroke-opacity="0.6" stroke-width="2"/>
    <circle cx="14" cy="14" r="4" fill="#f87171"/>
    <circle cx="28" cy="14" r="4" fill="#fbbf24"/>
    <circle cx="42" cy="14" r="4" fill="#34d399"/>
    <rect x="12" y="28" width="46" height="6" rx="3" fill="#3b82f6" opacity="0.8"/>
    <rect x="12" y="40" width="30" height="5" rx="2.5" fill="#ffffff" opacity="0.2"/>
    <rect x="20" y="51" width="60" height="5" rx="2.5" fill="#ffffff" opacity="0.2"/>
    <rect x="20" y="62" width="42" height="5" rx="2.5" fill="#8b5cf6" opacity="0.6"/>
  </g>

  <!-- desk -->
  <rect x="120" y="330" width="250" height="14" rx="7" fill="#1b2440"/>
  <rect x="150" y="344" width="16" height="66" fill="#131a33"/>
  <rect x="324" y="344" width="16" height="66" fill="#131a33"/>
  <rect x="148" y="404" width="20" height="8" rx="4" fill="#1b2440"/>
  <rect x="322" y="404" width="20" height="8" rx="4" fill="#1b2440"/>

  <!-- laptop -->
  <g transform="translate(160,226)">
    <rect x="0" y="0" width="170" height="112" rx="10" fill="#0d1226" stroke="#22d3ee" stroke-opacity="0.5"/>
    <rect x="8" y="8" width="154" height="96" rx="6" fill="#0a0e1a"/>
    <!-- code lines -->
    <rect x="18" y="22" width="60" height="7" rx="3.5" fill="#3b82f6"/>
    <rect x="28" y="38" width="90" height="6" rx="3" fill="#ffffff" opacity="0.22"/>
    <rect x="28" y="50" width="72" height="6" rx="3" fill="#22d3ee" opacity="0.55"/>
    <rect x="28" y="62" width="96" height="6" rx="3" fill="#ffffff" opacity="0.22"/>
    <rect x="18" y="80" width="50" height="7" rx="3.5" fill="#8b5cf6"/>
    <!-- cursor -->
    <rect x="130" y="62" width="8" height="10" rx="2" fill="#22d3ee"/>
  </g>

  <!-- character -->
  <g>
    <!-- body / hoodie -->
    <path d="M208 270 q-22 0 -30 22 -6 16 0 40 l12 44 h100 l12 -44 q6 -24 0 -40 q-8 -22 -30 -22 z" fill="#3b82f6"/>
    <!-- hoodie highlight -->
    <path d="M208 272 q40 -14 74 0" fill="none" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
    <!-- zipper -->
    <line x1="245" y1="280" x2="245" y2="356" stroke="#0a0e1a" stroke-width="4" opacity="0.5"/>
    <!-- arms -->
    <path d="M210 300 q-16 8 -22 28 l10 26 18 -6 -6 -30 z" fill="#356ee0"/>
    <path d="M280 300 q16 8 22 28 l-10 26 -18 -6 6 -30 z" fill="#356ee0"/>
    <!-- hands -->
    <circle cx="190" cy="356" r="10" fill="url(#skin)"/>
    <circle cx="300" cy="356" r="10" fill="url(#skin)"/>
    <!-- head -->
    <circle cx="245" cy="232" r="52" fill="url(#skin)"/>
    <!-- hair -->
    <path d="M193 228 q0 -52 52 -52 q52 0 52 52 q-10 -20 -26 -24 q-16 4 -26 22 q-12 -8 -26 -8 q-16 0 -26 10 z" fill="#1a2233"/>
    <path d="M193 228 q0 -52 52 -52 q20 0 34 10 q-24 -4 -40 16 q-18 -6 -34 4 q-8 10 -12 22 z" fill="#2a3550"/>
    <!-- eyes -->
    <ellipse cx="228" cy="234" rx="5" ry="6" fill="#0a0e1a"/>
    <ellipse cx="262" cy="234" rx="5" ry="6" fill="#0a0e1a"/>
    <circle cx="230" cy="231" r="1.6" fill="#22d3ee"/>
    <circle cx="264" cy="231" r="1.6" fill="#22d3ee"/>
    <!-- smile -->
    <path d="M233 254 q12 10 24 0" fill="none" stroke="#0a0e1a" stroke-width="3" stroke-linecap="round"/>
    <!-- glasses -->
    <circle cx="228" cy="234" r="14" fill="none" stroke="#22d3ee" stroke-width="3"/>
    <circle cx="262" cy="234" r="14" fill="none" stroke="#22d3ee" stroke-width="3"/>
    <line x1="242" y1="234" x2="248" y2="234" stroke="#22d3ee" stroke-width="3"/>
  </g>

  <!-- gradient underline glow -->
  <rect x="150" y="424" width="180" height="5" rx="2.5" fill="url(#accent)" opacity="0.55"/>
</svg>
